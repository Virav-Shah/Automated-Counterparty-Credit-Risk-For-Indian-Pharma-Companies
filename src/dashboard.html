<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pharma Counterparty Monitor</title>
<style>
:root{--ink:#172e35;--muted:#60757b;--line:#dce5e6;--bg:#f3f6f5;--teal:#14766c;--red:#b4473e;--amber:#a36821}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{background:#123a3b;color:white;padding:26px 5vw}header small{color:#9fc9c4;letter-spacing:2px;text-transform:uppercase}h1{font-size:29px;font-weight:550;margin:6px 0}header p{color:#c2d7d5;margin:4px 0}main{max-width:1440px;margin:auto;padding:26px 4vw}button,select,input{font:inherit;border:1px solid var(--line);border-radius:6px;padding:9px 12px;background:white;color:var(--ink)}button{cursor:pointer}button:hover{background:#edf4f2}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #70b8ae}label{color:var(--muted);font-size:12px;display:grid;gap:4px}.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:20px}.controls input{min-width:210px}.controls .push{margin-left:auto}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.card,.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:20px}.card span{color:var(--muted);font-size:12px}.card strong{display:block;font-size:32px;font-weight:550;margin:5px 0}.card p{font-size:12px;color:var(--muted);margin:0}.layout{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;align-items:start}.panel{min-width:0}.panel h2{font-size:18px;margin:0 0 4px}.sub{font-size:12px;color:var(--muted);margin:0 0 16px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}th{color:var(--muted);font-weight:500;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}td{padding:12px 8px;border-bottom:1px solid #edf0f1}.num{text-align:right}tbody tr[data-company]{cursor:pointer}tbody tr[data-company]:hover,tbody tr.selected{background:#eaf3ef}.pill{border-radius:4px;font-size:10px;padding:4px 6px;font-weight:650;letter-spacing:.2px;display:inline-block}.low{background:#e3f1eb;color:#246c53}.moderate{background:#fbefd9;color:var(--amber)}.high{background:#fae6e3;color:var(--red)}.na{background:#edf0f1;color:var(--muted)}.detail-head{display:flex;justify-content:space-between;gap:12px}.score{font-size:32px;white-space:nowrap}.score small{font-size:12px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.metric{border-bottom:1px solid var(--line);padding-bottom:9px}.metric span{display:block;font-size:11px;color:var(--muted)}.metric strong{display:block;font-size:19px;font-weight:550}.metric small{font-size:10px;color:var(--muted)}h3{font-size:13px;margin:22px 0 10px}.bars{display:grid;gap:8px}.bar{display:grid;grid-template-columns:125px 1fr 35px;gap:8px;font-size:11px;align-items:center}.track{height:7px;background:#edf1ef;border-radius:5px;overflow:hidden}.fill{height:100%;background:var(--teal)}.alert{padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.alert span{margin-right:6px}.note{background:#edf4f2;border-left:3px solid var(--teal);padding:12px;font-size:12px;margin:16px 0}.chart svg{width:100%;height:auto}.legend{display:flex;gap:14px;font-size:11px;color:var(--muted)}details{margin-top:22px;background:white;border:1px solid var(--line);border-radius:10px;padding:18px}summary{font-weight:600;cursor:pointer}details p,details li{font-size:12px;color:var(--muted)}footer{padding:22px 0;font-size:11px;color:var(--muted);overflow-wrap:anywhere}.empty{text-align:center;color:var(--muted);padding:30px}#history{margin-top:18px}.table-link{border:0;background:none;padding:0;text-align:left;font-weight:550;text-decoration:underline;text-underline-offset:3px} @media(max-width:1050px){.layout{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){main{padding:18px 12px}header{padding:22px 16px}h1{font-size:23px}.metrics{grid-template-columns:repeat(2,1fr)}.panel{padding:14px}.controls .push{margin-left:0}.cards{gap:8px}.card{padding:13px}}@media print{header{color:var(--ink);background:white}header p,header small{color:var(--muted)}.controls,.cards,#universe,details,footer{display:none}.layout{display:block}.panel{border:0}.chart svg{max-height:220px}body{background:white}}
</style></head><body><header><small>Counterparty credit monitoring</small><h1>Pharma financial risk monitor</h1><p>Five years of financial evidence. Higher scores indicate higher risk.</p></header><main>
<div class="controls"><label>Monitoring period<select id="year"></select></label><label>Peer universe<select id="group"><option value="">All groups</option></select></label><label>Find company<input id="search" placeholder="Search company name" type="search"></label><label>Sort by<select id="sort"><option value="risk">Risk score, highest first</option><option value="alerts">Alert count, highest first</option><option value="name">Company name</option></select></label><button id="download" class="push">Export filtered CSV</button></div>
<div class="cards" id="cards" aria-live="polite"></div><div class="layout"><section class="panel" id="universe"><h2>Counterparty universe</h2><p class="sub">Select a company to inspect risk drivers, trends and alerts.</p><div class="scroll"><table><thead><tr><th>Company</th><th class="num">Score /100</th><th>Rating</th><th class="num">YoY Δ</th><th class="num">Alerts</th></tr></thead><tbody id="table"></tbody></table></div></section><section class="panel" id="detail" aria-live="polite"></section></div>
<details><summary>Scoring methodology and data quality</summary><div id="method"></div></details><footer id="footer"></footer></main>
<script id="crm-data" type="application/json">__CRM_DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('crm-data').textContent), $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(x,p=false)=>x===null||x===undefined?'N/A':p?(x*100).toFixed(1)+'%':Number(x).toLocaleString('en',{maximumFractionDigits:2});
const labels={'VERY LOW':'low','LOW':'low','MODERATE':'moderate','HIGH':'high','CRITICAL':'high','NOT SCORED':'na'};
const badge=x=>`<span class="pill ${labels[x]||'na'}">${esc(x)}</span>`;
const warnings=r=>D.alerts.filter(a=>a.company_id===r.company_id&&a.fiscal_year===r.fiscal_year);
const years=[...new Set(D.rows.map(r=>r.fiscal_year))].sort();
$('year').innerHTML=years.map(y=>`<option>${esc(y)}</option>`).join('');$('year').value=D.latest_year;
$('group').innerHTML+=[...new Set(D.rows.map(r=>r.peer_group))].sort().map(g=>`<option>${esc(g)}</option>`).join('');
let selected=null,filtered=[];
function render(){
 filtered=D.rows.filter(r=>r.fiscal_year===$('year').value&&(!$('group').value||r.peer_group===$('group').value)&&r.company_id.toLowerCase().includes($('search').value.toLowerCase()));
 filtered.sort((a,b)=>$('sort').value==='name'?a.company_id.localeCompare(b.company_id):$('sort').value==='alerts'?warnings(b).length-warnings(a).length||a.company_id.localeCompare(b.company_id):(b.financial_risk_score??-1)-(a.financial_risk_score??-1)||a.company_id.localeCompare(b.company_id));
 const scored=filtered.filter(r=>r.financial_risk_score!==null), high=filtered.filter(r=>['HIGH','CRITICAL'].includes(r.risk_rating)).length, alertCount=filtered.reduce((n,r)=>n+warnings(r).length,0);
 $('cards').innerHTML=[['Companies',filtered.length,'In selected period and filters'],['High / critical',high,'Based on full financial scores'],['Median risk score',scored.length?fmt(median(scored.map(r=>r.financial_risk_score))):'N/A','Across scored companies'],['Active warnings',alertCount,'Rules triggered in selected period']].map(([l,n,s])=>`<div class="card"><span>${l}</span><strong>${n}</strong><p>${s}</p></div>`).join('');
 if(!filtered.some(r=>r.company_id===selected))selected=filtered[0]?.company_id;
 $('table').innerHTML=filtered.map(r=>`<tr data-company="${esc(r.company_id)}" class="${r.company_id===selected?'selected':''}"><td><button class="table-link">${esc(r.company_id)}</button></td><td class="num">${fmt(r.financial_risk_score)}</td><td>${badge(r.risk_rating)}</td><td class="num">${r.score_change>0?'+':''}${fmt(r.score_change)}</td><td class="num">${warnings(r).length}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No companies match the filters.</td></tr>';
 $('table').querySelectorAll('[data-company]').forEach(tr=>{tr.querySelector('button').onclick=()=>{selected=tr.dataset.company;render()}});
 renderDetail();
}
function median(a){a.sort((x,y)=>x-y);const m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}
function renderDetail(){
 const r=filtered.find(r=>r.company_id===selected);if(!r){$('detail').innerHTML='<p class="empty">Choose filters with matching companies.</p>';return}
 const ws=warnings(r),history=D.rows.filter(x=>x.company_id===r.company_id).sort((a,b)=>a.fiscal_year.localeCompare(b.fiscal_year));
 const metric=(label,key,p=false)=>`<div class="metric"><span>${label}</span><strong>${fmt(r[key],p)}${!p&&['debt_ebitda','net_debt_ebitda','interest_coverage','current_ratio'].includes(key)&&r[key]!==null?'x':''}</strong><small>Peer median ${fmt(r[key+'_peer_median'],p)}</small></div>`;
 let action=['HIGH','CRITICAL'].includes(r.risk_rating)||ws.some(a=>a.severity==='HIGH')?'Enhanced credit monitoring':r.risk_rating==='MODERATE'||ws.length?'Watchlist monitoring':'Routine monitoring';
 $('detail').innerHTML=`<div class="detail-head"><div><h2>${esc(r.company_id)}</h2><p class="sub">${esc(r.fiscal_year)} · ${esc(r.peer_group)}</p>${badge(r.risk_rating)}</div><div class="score">${fmt(r.financial_risk_score)}<small> /100</small></div></div><div class="metrics">${metric('Debt / EBITDA','debt_ebitda')}${metric('Net debt / EBITDA','net_debt_ebitda')}${metric('Interest coverage','interest_coverage')}${metric('Current ratio','current_ratio')}${metric('FCF / debt','fcf_debt',true)}<div class="metric"><span>Revenue growth</span><strong>${fmt(r.revenue_growth,true)}</strong><small>Year over year</small></div></div><h3>Risk score contributions</h3><div class="bars">${[['Leverage','leverage_points',25],['Debt servicing','servicing_points',20],['Cash flow','cash_flow_points',20],['Liquidity','liquidity_points',15],['Earnings','earnings_points',10],['Working capital','working_capital_points',10]].map(([l,k,m])=>`<div class="bar"><span>${l}</span><div class="track"><div class="fill" style="width:${(r[k]??0)/m*100}%"></div></div><span>${fmt(r[k])}/${m}</span></div>`).join('')}</div><h3>Five-year risk trend</h3><div class="chart">${chart(history)}</div><div class="legend"><span style="color:#14766c">● Total score /100</span><span style="color:#8b9eac">● Core score /80</span></div><p class="sub">FY21 total score unavailable: FY20 growth inputs were not supplied. Core scores remain comparable across all five years.</p><div class="scroll" id="history"><table><thead><tr><th>Period</th><th>Score</th><th>Rating</th><th>Leverage</th><th>FCF/debt</th></tr></thead><tbody>${history.map(h=>`<tr><td>${esc(h.fiscal_year)}</td><td>${fmt(h.financial_risk_score)}</td><td>${badge(h.risk_rating)}</td><td>${fmt(h.debt_ebitda)}x</td><td>${fmt(h.fcf_debt,true)}</td></tr>`).join('')}</tbody></table></div><h3>Peer comparison</h3><p class="sub">${esc(r.peer_risk_position)}. Risk percentile ${fmt(r.financial_risk_score_risk_percentile)} (higher = worse). ${r.peer_count} other companies; company excluded from its benchmark. ${esc(r.assignment_status)} group assignment.${r.peer_count<3?' Small peer sample: interpret cautiously.':''}</p><h3>Early warnings (${ws.length})</h3>${ws.map(a=>`<div class="alert"><span class="pill ${a.severity==='HIGH'?'high':'moderate'}">${esc(a.severity)}</span>${esc(a.explanation)}<br><small>${esc(a.metric)}: ${fmt(a.value,['debt_growth','revenue_growth','receivables_growth','fcf_debt'].includes(a.metric))}; threshold ${fmt(a.threshold,['debt_growth','revenue_growth','receivables_growth','fcf_debt'].includes(a.metric))}</small></div>`).join('')||'<p class="sub">No warnings triggered.</p>'}<div class="note">${action}. ${action==='Routine monitoring'?'Refresh at the next reporting cycle.':'Investigate the signals and reassess with new financial results.'}</div><button id="print">Print company report</button>`;
 $('print').onclick=()=>window.print();
}
function chart(history){
 const w=480,h=180,left=35,bottom=150,span=410,x=i=>left+i*span/(history.length-1),y=v=>bottom-v*1.2;
 let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Five-year risk score trend">`;
 for(let v=0;v<=100;v+=25)s+=`<line x1="${left}" y1="${y(v)}" x2="455" y2="${y(v)}" stroke="#e5ebec"/><text x="4" y="${y(v)+4}" fill="#60757b" font-size="10">${v}</text>`;
 for(const [key,color] of [['core_risk_score','#8b9eac'],['financial_risk_score','#14766c']]){
 const available=history.map((r,i)=>({v:r[key],i})).filter(a=>a.v!==null);
 s+=`<polyline fill="none" stroke="${color}" stroke-width="2" points="${available.map(a=>`${x(a.i)},${y(a.v)}`).join(' ')}"/>`;
 available.forEach(a=>s+=`<circle cx="${x(a.i)}" cy="${y(a.v)}" r="3" fill="${color}"><title>${esc(history[a.i].fiscal_year)}: ${a.v}</title></circle>`);
 }
 history.forEach((r,i)=>s+=`<text x="${x(i)}" y="173" text-anchor="middle" fill="#60757b" font-size="11">${esc(r.fiscal_year)}</text>`);
 return s+'</svg>';
}
$('download').onclick=()=>{const keys=['company_id','fiscal_year','peer_group','financial_risk_score','risk_rating','core_risk_score','score_change','debt_ebitda','interest_coverage','current_ratio','fcf_debt','revenue_growth','alert_count'];const cell=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const csv=[keys,...filtered.map(r=>keys.map(k=>k==='alert_count'?warnings(r).length:r[k]))].map(row=>row.map(cell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='credit_monitor_'+$('year').value+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
for(const id of ['year','group','sort'])$(id).onchange=render;$('search').oninput=render;
$('method').innerHTML=`<p>Model ${esc(D.config.version)}. Data: ${esc(D.source)}. Amounts: ${esc(D.config.units)}. Validation: ${D.checks.filter(c=>c.result==='PASS').length}/${D.checks.length} checks passed.</p><ul>${D.config.assumptions.map(a=>`<li>${esc(a)}</li>`).join('')}</ul><div class="scroll"><table><thead><tr><th>Component</th><th>Metric band</th><th>Points</th></tr></thead><tbody>${['leverage','coverage','cash_flow','liquidity','earnings','working_capital'].map(k=>{const spec=D.config[k];return spec.points.map((p,i)=>`<tr><td>${esc(k.replace('_',' '))}</td><td>${i===0?'Lowest band':`Above prior bound ${spec.upper_bounds[i-1]}`} ${i<spec.upper_bounds.length?`${(spec.upper_inclusive?.[i]??(k==='working_capital'))?'≤':'<'} ${spec.upper_bounds[i]}`:'(highest band)'}</td><td>${p}</td></tr>`).join('')}).join('')}</tbody></table></div><p>Band bounds use raw ratios and growth fractions (0.10 = 10%). Equal bounds enter the next band unless marked ≤. Working capital uses inclusive upper bounds.</p><p>Ratings: ${D.config.rating_labels.map((l,i)=>`${i?D.config.rating_upper_bounds[i-1]:0}–${i<D.config.rating_upper_bounds.length?D.config.rating_upper_bounds[i]-1:100}: ${esc(l)}`).join('; ')}. Zero debt makes FCF/debt unavailable; a debt-free cash deficit still receives 20 cash-flow points. Zero interest makes coverage unavailable and servicing points zero. Higher peer risk percentiles always indicate worse metrics. Benchmarks use other companies in the same group and fiscal year, excluding unavailable ratios.</p><div class="scroll"><table><thead><tr><th>Validation check</th><th>Result</th></tr></thead><tbody>${D.checks.map(c=>`<tr><td>${esc(c.check)}</td><td>${esc(c.result)}</td></tr>`).join('')}</tbody></table></div>`;
$('footer').textContent='Historical financial monitoring · Source SHA-256: '+D.source_sha256;
render();
</script>
<script>__V2_SCRIPT__</script></body></html>
